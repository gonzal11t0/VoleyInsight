<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VoleyInsight - Prueba V3 (Texto simplificado)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c15;
            color: #e5e7eb;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        /* Marcador */
        .scoreboard {
            background: linear-gradient(135deg, #1a1f2e, #0f1119);
            border-radius: 28px;
            padding: 20px 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(102,126,234,0.2);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .team {
            flex: 1;
        }

        .team-name {
            font-size: 14px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .team-score {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vs {
            font-size: 18px;
            font-weight: 700;
            color: #4b5563;
        }

        .set-info {
            margin-top: 12px;
            font-size: 12px;
            color: #6b7280;
        }

        .serving-badge {
            margin-top: 8px;
            display: inline-block;
            background: #1e3a5f;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Selector de equipo */
        .team-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .team-btn {
            flex: 1;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .team-btn.local {
            background: #1e3a5f;
            color: #93c5fd;
        }

        .team-btn.local.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }

        .team-btn.visitante {
            background: #3b1e3f;
            color: #f9a8d4;
        }

        .team-btn.visitante.active {
            background: #db2777;
            color: white;
            box-shadow: 0 4px 16px rgba(219,39,119,0.3);
        }

        /* CANCHA */
        .cancha-container {
            background: linear-gradient(135deg, #0f1119, #0a0c15);
            border-radius: 32px;
            padding: 20px 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(102,126,234,0.2);
        }

        .cancha-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cancha-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #93c5fd;
        }

        .cancha-subtitle {
            font-size: 10px;
            color: #6b7280;
        }

        .cancha-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .jugador-card {
            background: #1a1f2e;
            border: 1px solid #2d3748;
            border-radius: 60px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .jugador-card.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #667eea;
            transform: scale(0.97);
        }

        .jugador-numero {
            font-size: 24px;
            font-weight: 800;
            color: #e5e7eb;
        }

        .jugador-card.selected .jugador-numero {
            color: white;
        }

        /* BANCO - suplentes */
        .banco-container {
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .banco-seccion {
            margin-bottom: 16px;
        }

        .banco-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .banco-equipo-nombre {
            font-size: 12px;
            font-weight: 600;
        }

        .banco-equipo-nombre.local {
            color: #93c5fd;
        }

        .banco-equipo-nombre.visitante {
            color: #f9a8d4;
        }

        .banco-badge {
            font-size: 10px;
            background: #1a1f2e;
            padding: 2px 8px;
            border-radius: 20px;
            color: #9ca3af;
        }

        .banco-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .banco-item {
            background: #131724;
            border: 1px solid #2d3748;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .banco-item.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #667eea;
        }

        /* Acciones */
        .acciones-section {
            margin-top: 24px;
        }

        .acciones-title {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .acciones-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .accion-btn {
            background: #1a1f2e;
            border: 1px solid #2d3748;
            border-radius: 60px;
            padding: 12px 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            color: #e5e7eb;
        }

        .accion-btn.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #667eea;
            color: white;
        }

        .accion-btn.error {
            background: #3b1e1e;
            border-color: #991b1b;
        }

        .accion-btn.error.selected {
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .confirm-btn {
            flex: 2;
            background: #10b981;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            cursor: pointer;
        }

        .undo-btn {
            flex: 1;
            background: #374151;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: #e5e7eb;
            cursor: pointer;
        }

        .historial {
            margin-top: 20px;
            background: #0f1119;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #1f2937;
        }

        .historial-title {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .historial-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            color: #9ca3af;
        }

        .historial-item {
            padding: 4px 0;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
        }

        .feedback {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 100;
        }

        .feedback.show {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .jugador-numero {
                font-size: 18px;
            }
            .banco-item {
                padding: 6px 12px;
                font-size: 14px;
            }
            .accion-btn {
                font-size: 12px;
                padding: 10px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Marcador -->
        <div class="scoreboard">
            <div class="teams">
                <div class="team">
                    <div class="team-name" id="localName">LOCAL</div>
                    <div class="team-score" id="localScore">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="team">
                    <div class="team-name" id="visitanteName">VISITANTE</div>
                    <div class="team-score" id="visitanteScore">0</div>
                </div>
            </div>
            <div class="set-info">
                ⚡ Punto <span id="puntoNumero">0</span> | Set <span id="setNumero">1</span>
                <div><span class="serving-badge" id="servingBadge">🏐 SACA LOCAL</span></div>
            </div>
        </div>

        <!-- Selector de equipo (para anotar) -->
        <div class="team-selector">
            <button class="team-btn local" id="btnLocal">🔵 LOCAL</button>
            <button class="team-btn visitante" id="btnVisitante">🔴 VISITANTE</button>
        </div>

        <!-- CANCHA -->
        <div class="cancha-container" id="canchaContainer">
            <div class="cancha-header">
                <div class="cancha-title">🏐 EN CANCHA</div>
                <div class="cancha-subtitle">👆 Tocá un número</div>
            </div>
            <div class="cancha-grid" id="canchaGrid"></div>
        </div>

        <!-- BANCO -->
        <div class="banco-container" id="bancoContainer"></div>

        <!-- Acciones -->
        <div class="acciones-section">
            <div class="acciones-title">⚡ ACCIÓN</div>
            <div class="acciones-grid">
                <button class="accion-btn" data-accion="ATAQUE">🎯 ATAQUE</button>
                <button class="accion-btn" data-accion="BLOQUEO">🧱 BLOQUEO</button>
                <button class="accion-btn" data-accion="ACE">🏐 ACE</button>
                <button class="accion-btn error" data-accion="ERROR">❌ ERROR</button>
                <button class="accion-btn" data-accion="ERROR_RIVAL">⚠️ ERROR RIVAL</button>
                <button class="accion-btn" data-accion="OTRO">🎲 OTRO</button>
            </div>
        </div>

        <!-- Controles -->
        <div class="control-buttons">
            <button class="confirm-btn" id="confirmarBtn">✅ CONFIRMAR PUNTO</button>
            <button class="undo-btn" id="deshacerBtn">↩️ DESH</button>
        </div>

        <!-- Historial -->
        <div class="historial">
            <div class="historial-title">📋 ÚLTIMOS PUNTOS</div>
            <div class="historial-list" id="historialList">
                <div class="historial-item">Esperando puntos...</div>
            </div>
        </div>
    </div>

    <div class="feedback" id="feedbackMsg"></div>

    <script>
        // ========== DATOS DE EJEMPLO ==========
        const titularesLocal = [1, 2, 3, 4, 5, 6];
        const titularesVisitante = [7, 8, 9, 10, 11, 12];
        
        let bancoLocal = [13, 14, 15, 16];
        let bancoVisitante = [17, 18, 19, 20];

        // ========== ESTADO ==========
        let equipoQueSaca = 'LOCAL';
        let jugadorSeleccionado = null;
        let equipoSeleccionadoParaAnotar = 'LOCAL';

        let estadoPartido = {
            local: { score: 0, nombre: "LOCAL" },
            visitante: { score: 0, nombre: "VISITANTE" },
            accionSeleccionada: null,
            set: 1,
            punto: 0,
            historial: []
        };

        // ========== FUNCIONES ==========
        function getTitularesSegunSaque() {
            return equipoQueSaca === 'LOCAL' ? titularesLocal : titularesVisitante;
        }

        function getNombreEquipoQueSaca() {
            return equipoQueSaca === 'LOCAL' ? estadoPartido.local.nombre : estadoPartido.visitante.nombre;
        }

        function renderizarCancha() {
            const titulares = getTitularesSegunSaque();
            const grid = document.getElementById('canchaGrid');
            
            let html = '';
            titulares.forEach(num => {
                const selectedClass = (jugadorSeleccionado === num) ? 'selected' : '';
                html += `
                    <div class="jugador-card ${selectedClass}" data-jugador="${num}">
                        <div class="jugador-numero">${num}</div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            
            document.querySelectorAll('.jugador-card').forEach(card => {
                card.addEventListener('click', () => {
                    const num = parseInt(card.dataset.jugador);
                    jugadorSeleccionado = num;
                    mostrarFeedback(`👕 Jugador ${num} seleccionado`, 'info');
                    renderizarCancha();
                    renderizarBanco();
                });
            });
        }

        function renderizarBanco() {
            const container = document.getElementById('bancoContainer');
            
            let html = `
                <div class="banco-seccion">
                    <div class="banco-header">
                        <span class="banco-equipo-nombre local">🔵 ${estadoPartido.local.nombre}</span>
                        <span class="banco-badge">suplentes</span>
                    </div>
                    <div class="banco-grid">
            `;
            
            bancoLocal.forEach(num => {
                const selectedClass = (jugadorSeleccionado === num) ? 'selected' : '';
                html += `<div class="banco-item ${selectedClass}" data-jugador="${num}" data-equipo="LOCAL">${num}</div>`;
            });
            
            html += `</div></div>`;
            
            html += `
                <div class="banco-seccion">
                    <div class="banco-header">
                        <span class="banco-equipo-nombre visitante">🔴 ${estadoPartido.visitante.nombre}</span>
                        <span class="banco-badge">suplentes</span>
                    </div>
                    <div class="banco-grid">
            `;
            
            bancoVisitante.forEach(num => {
                const selectedClass = (jugadorSeleccionado === num) ? 'selected' : '';
                html += `<div class="banco-item ${selectedClass}" data-jugador="${num}" data-equipo="VISITANTE">${num}</div>`;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
            
            document.querySelectorAll('.banco-item').forEach(item => {
                item.addEventListener('click', () => {
                    const num = parseInt(item.dataset.jugador);
                    jugadorSeleccionado = num;
                    mostrarFeedback(`👕 Suplente ${num} seleccionado`, 'info');
                    renderizarCancha();
                    renderizarBanco();
                });
            });
        }

        function actualizarBadgeSaque() {
            const badge = document.getElementById('servingBadge');
            badge.innerHTML = `🏐 SACA ${getNombreEquipoQueSaca()}`;
            badge.style.background = equipoQueSaca === 'LOCAL' ? '#1e3a5f' : '#3b1e3f';
        }

        function toggleSaque() {
            equipoQueSaca = equipoQueSaca === 'LOCAL' ? 'VISITANTE' : 'LOCAL';
            actualizarBadgeSaque();
            renderizarCancha();
        }

        function renderizarAcciones() {
            document.querySelectorAll('.accion-btn').forEach(btn => {
                if (btn.dataset.accion === estadoPartido.accionSeleccionada) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function actualizarMarcador() {
            document.getElementById('localScore').innerText = estadoPartido.local.score;
            document.getElementById('visitanteScore').innerText = estadoPartido.visitante.score;
            document.getElementById('puntoNumero').innerText = estadoPartido.punto;
            document.getElementById('setNumero').innerText = estadoPartido.set;
            
            const btnLocal = document.getElementById('btnLocal');
            const btnVisitante = document.getElementById('btnVisitante');
            if (equipoSeleccionadoParaAnotar === 'LOCAL') {
                btnLocal.classList.add('active');
                btnVisitante.classList.remove('active');
            } else {
                btnLocal.classList.remove('active');
                btnVisitante.classList.add('active');
            }
        }

        function renderizarHistorial() {
            const container = document.getElementById('historialList');
            if (estadoPartido.historial.length === 0) {
                container.innerHTML = '<div class="historial-item">Esperando puntos...</div>';
                return;
            }
            const ultimos = estadoPartido.historial.slice(-6).reverse();
            container.innerHTML = ultimos.map(p => `
                <div class="historial-item">
                    <span style="color:${p.equipoAnota === 'LOCAL' ? '#93c5fd' : '#f9a8d4'}">${p.equipoAnota === 'LOCAL' ? estadoPartido.local.nombre : estadoPartido.visitante.nombre}</span>
                    <span>J${p.jugador || 'RIVAL'} - ${p.accion}</span>
                    <span>${p.marcadorDespues}</span>
                </div>
            `).join('');
        }

        function mostrarFeedback(msg) {
            const fb = document.getElementById('feedbackMsg');
            fb.innerText = msg;
            fb.classList.add('show');
            setTimeout(() => fb.classList.remove('show'), 1500);
        }

        function determinarEquipoAnota() {
            if (estadoPartido.accionSeleccionada === 'ERROR') {
                return equipoSeleccionadoParaAnotar === 'LOCAL' ? 'VISITANTE' : 'LOCAL';
            }
            if (estadoPartido.accionSeleccionada === 'ERROR_RIVAL') {
                return equipoSeleccionadoParaAnotar;
            }
            return equipoSeleccionadoParaAnotar;
        }

        function guardarPunto() {
            if (!estadoPartido.accionSeleccionada) {
                mostrarFeedback('❌ Seleccioná una acción');
                return;
            }
            if (estadoPartido.accionSeleccionada !== 'ERROR_RIVAL' && !jugadorSeleccionado) {
                mostrarFeedback('❌ Seleccioná un jugador');
                return;
            }
            
            const equipoAnota = determinarEquipoAnota();
            const marcadorAntes = `${estadoPartido.local.score}-${estadoPartido.visitante.score}`;
            
            if (equipoAnota === 'LOCAL') {
                estadoPartido.local.score++;
            } else {
                estadoPartido.visitante.score++;
            }
            
            const marcadorDespues = `${estadoPartido.local.score}-${estadoPartido.visitante.score}`;
            
            const punto = {
                timestamp: new Date().toISOString(),
                set: estadoPartido.set,
                punto: estadoPartido.punto + 1,
                equipo: equipoSeleccionadoParaAnotar,
                equipoAnota: equipoAnota,
                jugador: estadoPartido.accionSeleccionada === 'ERROR_RIVAL' ? null : jugadorSeleccionado,
                accion: estadoPartido.accionSeleccionada,
                marcadorAntes: marcadorAntes,
                marcadorDespues: marcadorDespues
            };
            
            estadoPartido.historial.push(punto);
            estadoPartido.punto++;
            
            estadoPartido.accionSeleccionada = null;
            jugadorSeleccionado = null;
            
            renderizarCancha();
            renderizarBanco();
            renderizarAcciones();
            actualizarMarcador();
            renderizarHistorial();
            
            mostrarFeedback(`✅ Punto para ${equipoAnota === 'LOCAL' ? estadoPartido.local.nombre : estadoPartido.visitante.nombre}`);
            
            toggleSaque();
        }

        function deshacerPunto() {
            if (estadoPartido.historial.length === 0) {
                mostrarFeedback('⚠️ No hay puntos para deshacer');
                return;
            }
            
            const ultimo = estadoPartido.historial.pop();
            if (ultimo.equipoAnota === 'LOCAL') {
                estadoPartido.local.score--;
            } else {
                estadoPartido.visitante.score--;
            }
            estadoPartido.punto--;
            
            renderizarCancha();
            renderizarBanco();
            renderizarAcciones();
            actualizarMarcador();
            renderizarHistorial();
            
            mostrarFeedback('↩️ Punto deshecho');
        }

        // ========== EVENT LISTENERS ==========
        function setupEventListeners() {
            document.getElementById('btnLocal').addEventListener('click', () => {
                equipoSeleccionadoParaAnotar = 'LOCAL';
                jugadorSeleccionado = null;
                estadoPartido.accionSeleccionada = null;
                renderizarCancha();
                renderizarBanco();
                renderizarAcciones();
                actualizarMarcador();
                mostrarFeedback(`🔵 Anotando para ${estadoPartido.local.nombre}`);
            });
            
            document.getElementById('btnVisitante').addEventListener('click', () => {
                equipoSeleccionadoParaAnotar = 'VISITANTE';
                jugadorSeleccionado = null;
                estadoPartido.accionSeleccionada = null;
                renderizarCancha();
                renderizarBanco();
                renderizarAcciones();
                actualizarMarcador();
                mostrarFeedback(`🔴 Anotando para ${estadoPartido.visitante.nombre}`);
            });
            
            document.querySelectorAll('.accion-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    estadoPartido.accionSeleccionada = btn.dataset.accion;
                    renderizarAcciones();
                    mostrarFeedback(`⚡ ${btn.dataset.accion} seleccionado`);
                });
            });
            
            document.getElementById('confirmarBtn').addEventListener('click', guardarPunto);
            document.getElementById('deshacerBtn').addEventListener('click', deshacerPunto);
            
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                const key = e.key.toLowerCase();
                
                if (key === 'q') document.getElementById('btnLocal').click();
                else if (key === 'w') document.getElementById('btnVisitante').click();
                else if (key === 'a') document.querySelector('[data-accion="ATAQUE"]')?.click();
                else if (key === 's') document.querySelector('[data-accion="BLOQUEO"]')?.click();
                else if (key === 'd') document.querySelector('[data-accion="ACE"]')?.click();
                else if (key === 'f') document.querySelector('[data-accion="ERROR_RIVAL"]')?.click();
                else if (key === 'r') document.querySelector('[data-accion="ERROR"]')?.click();
                else if (key === 'enter') document.getElementById('confirmarBtn').click();
                else if (key === 'z') document.getElementById('deshacerBtn').click();
                
                else if (/^[0-9]$/.test(key)) {
                    const num = parseInt(key);
                    const titulares = getTitularesSegunSaque();
                    if (titulares.includes(num)) {
                        const card = document.querySelector(`.jugador-card[data-jugador="${num}"]`);
                        if (card) card.click();
                    } else if (bancoLocal.includes(num) || bancoVisitante.includes(num)) {
                        const bancoItem = document.querySelector(`.banco-item[data-jugador="${num}"]`);
                        if (bancoItem) bancoItem.click();
                    }
                }
            });
        }

        function init() {
            actualizarBadgeSaque();
            renderizarCancha();
            renderizarBanco();
            renderizarAcciones();
            actualizarMarcador();
            setupEventListeners();
            mostrarFeedback('🏐 Versión 3 - Cancha simple, texto limpio');
        }
        
        init();
    </script>
</body>
</html>
